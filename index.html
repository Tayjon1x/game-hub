<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Hub</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d1224;
      color: white;
    }

    header {
      background: #171f3b;
      padding: 25px;
      text-align: center;
    }

    h1 {
      font-size: 40px;
      margin: 0;
    }

    .games {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 30px;
    }

    .game {
      background: #202b4d;
      padding: 25px;
      border-radius: 15px;
      width: 220px;
      text-align: center;
    }

    button {
      background: #6c63ff;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>🎮 Game Hub</h1>
  <p>Pick a game and play!</p>
</header>

<div class="games">

  <div class="game">
    <h2>🏁 Slope</h2>
    <p>Play Slope</p>

    <button onclick="openGame('slope')">
      PLAY
    </button>

    <div id="slope" style="display:none; margin-top:20px;">
<iframe src="https://slope-3.bitbucket.io/" width="800" height="600" frameborder="0" scrolling="no" allowfullscreen></iframe>


  

  <button onclick="closeGame('slope')">CLOSE GAME</button>
</div>
  </div>

</div>

</div>
<script>
function openGame(id) {
  document.getElementById(id).style.display = "block";

  

function closeGame(id) {
  document.getElementById(id).style.display = "none";
}

function startSlope() {
  const canvas = document.getElementById("slopeGame");
  const ctx = canvas.getContext("2d");

  let playerX = 300;
  let playerY = 330;
  let speed = 4;
  let left = false;
  let right = false;
  let gameOver = false;

  let blocks = [
    {x: 100, y: -50, w: 70, h: 30},
    {x: 400, y: -250, w: 70, h: 30},
    {x: 250, y: -450, w: 70, h: 30}
  ];

  document.onkeydown = function(e) {
    if (e.key === "ArrowLeft") left = true;
    if (e.key === "ArrowRight") right = true;
  };

  document.onkeyup = function(e) {
    if (e.key === "ArrowLeft") left = false;
    if (e.key === "ArrowRight") right = false;
  };

  function gameLoop() {
    if (gameOver) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Track
    ctx.fillStyle = "#222";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Player
    if (left) playerX -= 6;
    if (right) playerX += 6;

    playerX = Math.max(15, Math.min(canvas.width - 15, playerX));

    ctx.fillStyle = "#6c63ff";
    ctx.beginPath();
    ctx.arc(playerX, playerY, 15, 0, Math.PI * 2);
    ctx.fill();

    // Blocks
    ctx.fillStyle = "#ff4444";

    for (let block of blocks) {
      block.y += speed;

      ctx.fillRect(block.x, block.y, block.w, block.h);

      if (
        playerX + 15 > block.x &&
        playerX - 15 < block.x + block.w &&
        playerY + 15 > block.y &&
        playerY - 15 < block.y + block.h
      ) {
        gameOver = true;

        ctx.fillStyle = "white";
        ctx.font = "35px Arial";
        ctx.fillText("GAME OVER", 190, 200);

        ctx.font = "18px Arial";
        ctx.fillText("Refresh to play again", 210, 235);

        return;
      }

      if (block.y > canvas.height) {
        block.y = -50;
        block.x = Math.random() * (canvas.width - block.w);
      }
    }

    requestAnimationFrame(gameLoop);
  }

  gameLoop();
}
</script>
  
</body>
</html>
