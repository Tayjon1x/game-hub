<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Hub</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d1224;
      color: white;
    }

    header {
      background: #171f3b;
      padding: 25px;
      text-align: center;
    }

    h1 {
      font-size: 40px;
      margin: 0;
    }

    .games {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 30px;
    }

    .game {
      background: #202b4d;
      padding: 25px;
      border-radius: 15px;
      width: 220px;
      text-align: center;
    }

    button {
      background: #6c63ff;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .game-area {
      display: none;
      width: 100%;
      margin-top: 20px;
      text-align: center;
    }

    iframe {
      width: 100%;
      max-width: 900px;
      height: 600px;
      border: none;
      border-radius: 12px;
      background: black;
    }
  </style>
</head>

<body>

<header>
  <h1>🎮 Game Hub</h1>
  <p>Pick a game and play!</p>
</header>

<div class="games">

  <div class="game">
    <h2>🏁 Slope</h2>
    <p>Play Slope</p>

    <button onclick="openGame('slope')">
      PLAY
    </button>

    <div id="slope" class="game-area">

      <iframe
        <iframe src="https://slope-3.bitbucket.io/" width="800" height="600" frameborder="0" scrolling="no" allowfullscreen></iframe>

        title="Slope"
        allowfullscreen>
      </iframe>

      <br><br>

      <button onclick="closeGame('slope')">
        CLOSE GAME
      </button>

    </div>
  </div>

</div>

<script>
function openGame(id) {
  document.getElementById(id).style.display = "block";
}

function closeGame(id) {
  document.getElementById(id).style.display = "none";
}
</script>

</body>
</html>
